<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#101419"/>
  <title>Страница не найдена — DayZ Companion</title>
  <link rel="icon" href="/favicon.ico"/>
  <style>
    :root { color-scheme: dark; font: 16px/1.55 "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0c1015; color: #edf1f4; }
    header { border-bottom: 1px solid #303a44; padding: 18px 24px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; font-size: 1.25rem; font-weight: 800; text-decoration: none; }
    .brand img { display: block; }
    .brand strong, .code { color: #ff8282; }
    main { width: min(100% - 40px, 640px); margin: clamp(36px, 10vw, 120px) auto; padding: clamp(22px, 6vw, 48px); border: 1px solid #303a44; border-radius: 18px; background: #171d24; }
    .code { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 8px 0 12px; font-size: clamp(1.75rem, 6vw, 2.75rem); line-height: 1.15; }
    .message { margin: 0; color: #b9c2cc; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    nav a { padding: 10px 16px; border: 1px solid #52606e; border-radius: 10px; color: inherit; text-decoration: none; font-weight: 600; }
    nav a:first-child { background: #94333a; border-color: #b9555a; }
    nav a:hover { border-color: #ff8282; }
    a:focus-visible { outline: 2px solid #ff8282; outline-offset: 4px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="/assets/dayz-logo-mark.png" width="46" height="28" alt=""/>
      <span>DayZ <strong>Companion</strong></span>
    </a>
  </header>
  <main>
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p class="message">Возможно, адрес изменился или в ссылке есть опечатка.</p>
    <nav aria-label="Разделы сайта">
      <a href="/">На главную</a>
      <a href="/download/">Скачать</a>
      <a href="/#support">Поддержка</a>
      <a href="/en/" lang="en">English home</a>
    </nav>
  </main>
<script>
if (location.pathname === "/en" || location.pathname.startsWith("/en/")) {
  document.documentElement.lang = "en";
  document.title = "Page not found - DayZ Companion";
  document.querySelector("h1").textContent = "Page not found";
  document.querySelector(".message").textContent = "This page may have been moved, or the link may contain an error.";
  document.querySelector(".brand").href = "/en/";
  const nav = document.querySelector("main nav");
  nav.setAttribute("aria-label", "Site sections");
  const labels = [["/en/", "Home", "en"], ["/en/download/", "Download", "en"], ["/en/#support", "Support", "en"], ["/", "\u0420\u0443\u0441\u0441\u043a\u0430\u044f \u0432\u0435\u0440\u0441\u0438\u044f", "ru"]];
  [...nav.querySelectorAll("a")].forEach((a,i)=>{a.href=labels[i][0];a.textContent=labels[i][1];a.lang=labels[i][2];});
}
</script>
</body>
</html>
